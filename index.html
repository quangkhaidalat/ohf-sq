<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>OHF-SQ Pilot Form</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: a clinical case-report form — sticky step bar, one column of modules, result sheet at the end */
:root{
  --bg:#f4f6f5; --surface:#ffffff; --ink:#17201f; --muted:#5b6866; --line:#d8dfdd;
  --accent:#0d6e6a; --accent-weak:#e1efee; --pos:#b4432c; --pos-weak:#f8e6e1; --ok:#2f7a45; --ok-weak:#e3f1e7; --warn:#9a6a00; --warn-weak:#f7efd9;
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111716; --surface:#19211f; --ink:#e4ecea; --muted:#9aa9a6; --line:#2d3936;
  --accent:#4fb8b1; --accent-weak:#163634; --pos:#ef8a72; --pos-weak:#3a201a; --ok:#7cc994; --ok-weak:#17301f; --warn:#e2b54f; --warn-weak:#33290f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111716; --surface:#19211f; --ink:#e4ecea; --muted:#9aa9a6; --line:#2d3936;
  --accent:#4fb8b1; --accent-weak:#163634; --pos:#ef8a72; --pos-weak:#3a201a; --ok:#7cc994; --ok-weak:#17301f; --warn:#e2b54f; --warn-weak:#33290f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .in{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.brand{font-weight:700}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
nav.steps{display:flex;gap:4px;flex-wrap:wrap}
nav.steps button{font:inherit;font-size:13px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 10px;border-radius:999px;cursor:pointer}
nav.steps button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
nav.steps .n{font-family:var(--mono);opacity:.7;margin-right:4px}
h1{font-size:24px;line-height:1.25;margin:28px 0 6px;text-wrap:balance}
h2{font-size:18px;margin:0;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 18px;max-width:65ch}
.note{font-size:13px;color:var(--muted)}
.banner{background:var(--warn-weak);border:1px solid var(--line);border-left:4px solid var(--warn);padding:10px 12px;border-radius:6px;font-size:13px;margin:12px 0}
section.mod{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:16px 0;overflow:hidden}
.mod-h{display:flex;gap:12px;align-items:baseline;justify-content:space-between;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.mod-h .tag{font-family:var(--mono);font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.mod-h .src{font-size:12px;color:var(--muted)}
.mod-b{padding:4px 16px 14px}
.q{display:grid;grid-template-columns:2.4em 1fr;gap:4px 8px;padding:12px 0;border-bottom:1px dashed var(--line)}
.q:last-child{border-bottom:0}
.q .no{font-family:var(--mono);color:var(--muted);font-size:13px;padding-top:2px}
.q .txt{min-width:0}
.opts{grid-column:2;display:flex;flex-wrap:wrap;gap:6px}
.opts label{position:relative;cursor:pointer}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts span{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:13px;background:var(--bg)}
.opts input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.opts input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.score{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 16px;background:var(--bg);border-top:1px solid var(--line);font-size:14px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;border:1px solid transparent}
.pill.pos{background:var(--pos-weak);color:var(--pos);border-color:var(--pos)}
.pill.neg{background:var(--ok-weak);color:var(--ok);border-color:var(--ok)}
.pill.na{background:transparent;color:var(--muted);border-color:var(--line)}
.pill.tmp{background:var(--warn-weak);color:var(--warn);border-color:var(--warn)}
/* food cards */
.lvhead{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.lvhead .bar{display:inline-flex;gap:2px}.lvhead .bar i{width:10px;height:6px;border-radius:2px;background:var(--line)}.lvhead .bar i.on{background:var(--accent)}
.foodgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:640px){.foodgrid{grid-template-columns:minmax(0,1fr)}}
.food{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface)}
.food.done{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.food .pic{width:120px;height:90px;border-radius:8px;background:#f7f4ee;display:flex;align-items:center;justify-content:center}
.food .pic svg{width:120px;height:90px;display:block}
.food .nm{font-weight:600;font-size:15px;line-height:1.3}
.food .nm small{font-family:var(--mono);font-weight:400;color:var(--muted);margin-right:4px}
.food .opts{grid-column:1/-1;flex-wrap:wrap}
.food .opts span{padding:4px 8px;font-size:12.5px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field input,.field select{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0;width:100%}
.field input:focus-visible,.field select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.btn{font:inherit;font-size:14px;font-weight:600;border-radius:8px;padding:9px 14px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--surface)}
button.btn.ghost{background:transparent;color:var(--accent)}
button.btn.sm{padding:3px 9px;font-size:12px}
button.btn:disabled{opacity:.45;cursor:not-allowed}
button.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* ODK */
.syl{display:flex;gap:6px;margin:12px 0}
.syl button{font:inherit;font-family:var(--mono);font-size:16px;font-weight:600;padding:8px 18px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.syl button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-weak);color:var(--accent)}
.pad{user-select:none;-webkit-user-select:none;touch-action:manipulation;width:100%;min-height:170px;border-radius:14px;border:2px dashed var(--line);background:var(--bg);color:var(--muted);font:inherit;font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
.pad.live{border-style:solid;border-color:var(--accent);background:var(--accent-weak);color:var(--ink)}
.pad .big{font-family:var(--mono);font-size:44px;font-weight:600;line-height:1;color:var(--ink)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;width:0;background:var(--accent)}
.trials{display:grid;gap:8px;margin-top:12px}
.trial{display:grid;grid-template-columns:4.5em 1fr auto;gap:10px;align-items:center;font-size:13px}
.trial svg{width:100%;height:26px;display:block}
.trial .val{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;min-width:7.5em}
.trial .val.bad{color:var(--warn)}
.manual{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:6px}
.manual input{width:5em;font:inherit;font-family:var(--mono);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.odkgrid{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:8px;align-items:stretch;margin-top:12px}
.odkgrid .sylh{font-family:var(--mono);font-weight:600;font-size:18px;display:flex;align-items:center;padding-right:6px}
.odkgrid .colh{font-size:12px;color:var(--muted);text-align:center}
.slot{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--bg);display:flex;flex-direction:column;gap:6px;min-width:0}
.slot.live{border-color:var(--accent);background:var(--accent-weak)}
.slot.ok{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:var(--surface)}
.slot.bad{border-color:var(--warn)}
.slot .hd{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.slot .rate{font-family:var(--mono);font-size:22px;font-weight:600;line-height:1.1}
.slot .rate small{font-size:12px;color:var(--muted);font-weight:400}
.slot .st{font-size:12px;color:var(--muted);min-height:2.4em}
.slot .st.warn{color:var(--warn)}
.slot svg{width:100%;height:40px;display:block}
.slot .bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}.slot .bar i{display:block;height:100%;width:0;background:var(--accent)}
.slot .acts{display:flex;flex-wrap:wrap;gap:4px}
.slot .acts button{font:inherit;font-size:12px;padding:3px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.slot .acts button.main{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.slot .acts button:disabled{opacity:.4;cursor:not-allowed}
.slot .acts button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.slot .man{display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.slot .man input{width:4.2em;font:inherit;font-family:var(--mono);font-size:12px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:2px 4px}
@media (max-width:640px){.odkgrid{grid-template-columns:minmax(0,1fr)}.odkgrid .colh{display:none}.odkgrid .sylh{padding-top:8px}}
.odksum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.odksum div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.odksum b{display:block;font-family:var(--mono);font-size:20px}
.odksum small{color:var(--muted)}
/* TCI */
.tongue{display:grid;grid-template-columns:minmax(0,280px) 1fr;gap:20px;align-items:start}
.tongue .stage{background:radial-gradient(ellipse at 50% 40%,#3a1f22 0%,#1d1112 75%);border-radius:14px;padding:10px}
.tongue svg.tg{width:100%;height:auto;display:block}
.tongue .cell{cursor:pointer}
.tongue .cell:focus{outline:none}
.tongue .cell:focus-visible .ring{stroke:#fff;stroke-width:3}
.legend{font-size:13px;display:grid;gap:10px;min-width:0}
.sw{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center}
.sw svg{width:72px;height:48px;border-radius:8px;display:block}
.tcibar{display:flex;gap:4px;flex-wrap:wrap}
@media (max-width:620px){.tongue{grid-template-columns:1fr}.tongue .stage{max-width:300px}}
/* Results */
table.res{width:100%;border-collapse:collapse;font-size:14px}
table.res th,table.res td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.res th{font-size:12px;color:var(--muted);font-weight:500}
table.res td.code{font-family:var(--mono);color:var(--muted);white-space:nowrap}
.tblwrap{overflow-x:auto}
.verdict{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);margin:16px 0}
.verdict .count{font-family:var(--mono);font-size:40px;font-weight:600;line-height:1}
.verdict .count small{font-size:16px;color:var(--muted)}
.verdict>div:last-child{min-width:0;flex:1}
textarea#csvout{width:100%;min-height:90px;font-family:var(--mono);font-size:12px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:13px}
.toast{font-size:13px;color:var(--ok)}
@media (max-width:520px){.trial{grid-template-columns:3.6em 1fr}.trial .val{grid-column:1/-1;text-align:left}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>


</head>
<body>
<header class="top"><div class="in">
  <div class="brand"><span data-t="brand"></span><small data-t="brandSub"></small></div>
  <a href="vi.html" style="font-size:13px;color:var(--accent)">Tiếng Việt</a>
  <nav class="steps" data-ta="navLabel">
    <button type="button" data-step="info"><span class="n">1</span><span data-t="s1"></span></button>
    <button type="button" data-step="q"><span class="n">2</span><span data-t="s2"></span></button>
    <button type="button" data-step="t"><span class="n">3</span><span data-t="s3"></span></button>
    <button type="button" data-step="r"><span class="n">4</span><span data-t="s4"></span></button>
  </nav>
</div></header>

<main class="wrap">
<div id="step-info" class="step">
  <h1 data-t="infoH"></h1>
  <p class="lead" data-t="infoLead"></p>
  <div class="banner" data-t="banner"></div>
  <section class="mod"><div class="mod-b" style="padding-top:14px">
    <div class="grid2">
      <label class="field"><span data-t="fId"></span><input id="f-id" type="text" autocomplete="off"></label>
      <label class="field"><span data-t="fDate"></span><input id="f-date" type="date"></label>
      <label class="field"><span data-t="fAge"></span><input id="f-age" type="number" min="40" max="110" inputmode="numeric"></label>
      <label class="field"><span data-t="fSex"></span><select id="f-sex"></select></label>
      <label class="field"><span data-t="fSetting"></span><select id="f-setting"></select></label>
      <label class="field"><span data-t="fExam"></span><input id="f-exam" type="text" autocomplete="off"></label>
    </div>
  </div></section>
  <div class="row">
    <button type="button" class="btn" data-go="q" data-t="startQ"></button>
    <button type="button" class="btn ghost" id="btn-sample" data-t="sample"></button>
    <span class="confirm" id="reset-wrap"></span>
  </div>
  <p class="note" id="draft-note"></p>
</div>

<div id="step-q" class="step" hidden>
  <h1 data-t="qH"></h1>
  <p class="lead" data-t="qLead"></p>
  <section class="mod">
    <div class="mod-h"><div><span class="tag" data-t="aTag"></span><h2 data-t="aH"></h2></div><span class="src" data-t="aSrc"></span></div>
    <div class="mod-b" id="eat"></div>
    <div class="score"><span data-t="eatTot"></span> <b class="num" id="eat-total">–</b>/40 <span id="eat-pill"></span><span class="note" data-t="eatRule"></span></div>
  </section>
  <section class="mod">
    <div class="mod-h"><div><span class="tag" data-t="bTag"></span><h2 data-t="bH"></h2></div><span class="src" data-t="bSrc"></span></div>
    <div class="mod-b" id="chew"></div>
  </section>
  <section class="mod">
    <div class="mod-h"><div><span class="tag" data-t="fTag"></span><h2 data-t="fH"></h2></div><span class="src" data-t="fSrc"></span></div>
    <div class="mod-b"><div id="foods"></div><p class="note" data-t="fNote"></p></div>
    <div class="score"><span data-t="csTot"></span> <b class="num" id="cs-total">–</b>/100 <span id="cs-pill"></span><span class="note" data-t="csRule"></span></div>
  </section>
  <section class="mod">
    <div class="mod-h"><div><span class="tag" data-t="cTag"></span><h2 data-t="cH"></h2></div><span class="src" data-t="cSrc"></span></div>
    <div class="mod-b" id="xi"></div>
    <div class="score"><span data-t="xiTot"></span> <b class="num" id="xi-total">–</b>/25 <span id="xi-pill"></span><span class="note" data-t="xiRule"></span></div>
  </section>
  <section class="mod">
    <div class="mod-h"><div><span class="tag" data-t="dTag"></span><h2 data-t="dH"></h2></div><span class="src" data-t="dSrc"></span></div>
    <div class="mod-b" id="tongueq"></div>
    <div class="score note" data-t="dRule"></div>
  </section>
  <div class="row"><button type="button" class="btn" data-go="t" data-t="toTests"></button><span class="note" id="q-missing"></span></div>
</div>

<div id="step-t" class="step" hidden>
  <h1 data-t="tH"></h1>
  <p class="lead" data-t="tLead"></p>
  <section class="mod">
    <div class="mod-h"><div><span class="tag" data-t="odkTag"></span><h2 data-t="odkH"></h2></div><span class="src" data-t="odkSrc"></span></div>
    <div class="mod-b">
      <p class="note" style="margin-top:10px" data-t="odkHow"></p>
      <p class="banner" id="mic-note" hidden></p>
      <div class="odkgrid" id="odkgrid"></div>
      <div class="odksum" id="odksum"></div>
    </div>
  </section>
  <section class="mod">
    <div class="mod-h"><div><span class="tag" data-t="tciTag"></span><h2 data-t="tciH"></h2></div><span class="src" data-t="tciSrc"></span></div>
    <div class="mod-b" style="padding-top:14px">
      <div class="tongue">
        <div class="stage"><svg class="tg" id="tci-svg" viewBox="0 0 260 320" role="group"></svg></div>
        <div class="legend" id="tci-legend"></div>
      </div>
    </div>
    <div class="score"><span>TCI:</span> <b class="num" id="tci-pct">–</b> % <span id="tci-pill"></span><span class="note" data-t="tciRule"></span></div>
  </section>
  <div class="row"><button type="button" class="btn" data-go="r" data-t="toResults"></button></div>
</div>

<div id="step-r" class="step" hidden>
  <h1 data-t="rH"></h1>
  <p class="lead" id="r-who"></p>
  <div class="verdict" id="verdict"></div>
  <section class="mod"><div class="tblwrap"><table class="res" id="restbl"></table></div></section>
  <p class="note" data-t="rNote"></p>
  <section class="mod"><div class="mod-h"><h2 data-t="expH"></h2><span class="src" data-t="expSub"></span></div>
    <div class="mod-b" style="padding-top:12px">
      <div class="row"><button type="button" class="btn" id="btn-dl" hidden data-t="dl"></button><button type="button" class="btn ghost" id="btn-copy" data-t="copy"></button><span class="toast" id="toast"></span></div>
      <p class="note" data-t="expNote"></p>
      <textarea id="csvout" readonly></textarea>
    </div>
  </section>
</div>
</main>

<script>
/* Food illustrations: hand-drawn SVG, semi-realistic (gradients, highlights, shadows). viewBox 0 0 120 90 */
const ART=(function(){
const sh='<ellipse cx="60" cy="81" rx="46" ry="6" fill="#000" opacity=".13"/>';
const lg=(id,a,b,x2,y2)=>`<linearGradient id="${id}" x1="0" y1="0" x2="${x2??0}" y2="${y2??1}"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;
const rg=(id,a,b,cx,cy)=>`<radialGradient id="${id}" cx="${cx??.4}" cy="${cy??.35}" r=".75"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></radialGradient>`;
const plate=(p)=>`${sh}<ellipse cx="60" cy="62" rx="52" ry="18" fill="url(#${p}pl)" stroke="#c9cfd4"/><ellipse cx="60" cy="61" rx="40" ry="12.5" fill="#fbfcfd" stroke="#e1e5e8"/>`;

/* ---------- ODK: automatic syllable counting, 3 slots per syllable ---------- */
/* Syllable counter for ODK recordings. samples: Float32Array, sr: sample rate, go: sample index where speaking may begin */
function detectSyllables(samples,sr,go){
 const hop=Math.round(sr*0.01),n=Math.floor(samples.length/hop),env=new Float32Array(n);
 for(let f=0;f<n;f++){let s=0;for(let k=f*hop;k<(f+1)*hop;k++)s+=samples[k]*samples[k];env[f]=Math.sqrt(s/hop)}
 const sm=new Float32Array(n);for(let f=0;f<n;f++){let s=0,c=0;for(let k=f-2;k<=f+2;k++)if(k>=0&&k<n){s+=env[k];c++}sm[f]=s/c}
 const db=Array.from(sm,v=>20*Math.log10(v+1e-7));
 const goF=Math.floor(go/hop);const seg=db.slice(goF).slice().sort((a,b)=>a-b);
 const pct=p=>seg[Math.min(seg.length-1,Math.max(0,Math.floor(p*seg.length)))];
 const all=db.slice().sort((a,b)=>a-b);const noise=Math.min(all[Math.floor(.1*all.length)],pct(.1));const top=pct(.98);
 if(top-noise<12)return{ok:false,why:"quiet",peaks:[],t0:null,count:0,db,hop,goF,thr:null};
 const thr=noise+0.35*(top-noise);
 const maxima=[];for(let f=Math.max(goF,3);f<n-3;f++){if(db[f]<thr)continue;let m=true;for(let k=f-3;k<=f+3;k++)if(db[k]>db[f]||(db[k]===db[f]&&k<f)){m=false;break}if(m)maxima.push(f)}
 const kept=[];
 for(const f of maxima){if(!kept.length){kept.push(f);continue}const p=kept[kept.length-1];let mn=Infinity;for(let k=p;k<=f;k++)mn=Math.min(mn,db[k]);
  if(f-p>=6&&mn<Math.min(db[p],db[f])-4)kept.push(f);else if(db[f]>db[p])kept[kept.length-1]=f}
 if(!kept.length)return{ok:false,why:"none",peaks:[],t0:null,count:0,db,hop,goF,thr};
 const ons=kept.map((f,i)=>{const lo=i?kept[i-1]:goF;let b=f;for(let k=f;k>=lo;k--){if(db[k]<db[b])b=k}let o=b;while(o<f&&db[o]<thr)o++;if(i===0){o=f;while(o>goF&&db[o-1]>=thr)o--}return o});
 const t0=(ons[0]-goF)*0.01;const onsT=ons.map(f=>(f-goF)*0.01);const count=onsT.filter(t=>t>=t0-1e-9&&t<t0+5).length;
 return{ok:true,peaks:kept.map(f=>(f-goF)*0.01),onsets:onsT,t0,count,db,hop,goF,thr};}


const AUD={};let busy=null,mic=null,actx=null;
function micNote(){const n=$("#mic-note");n.textContent=T.micNote;n.hidden=false}
async function ensureMic(){if(mic)return;if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error("nomic");
 mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
 actx=new (window.AudioContext||window.webkitAudioContext)();}
function slotKey(s,i){return s+"-"+i}
async function record(s,i){if(busy)return;
 try{await ensureMic()}catch(e){micNote();return}
 if(actx.state==="suspended")await actx.resume();
 const sr=actx.sampleRate,src=actx.createMediaStreamSource(mic),hp=actx.createBiquadFilter(),lp=actx.createBiquadFilter(),proc=actx.createScriptProcessor(2048,1,1),mute=actx.createGain();
 hp.type="highpass";hp.frequency.value=120;lp.type="lowpass";lp.frequency.value=4000;mute.gain.value=0;
 const chunks=[];let cap=false;proc.onaudioprocess=e=>{if(cap)chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)))};
 src.connect(hp);hp.connect(lp);lp.connect(proc);proc.connect(mute);mute.connect(actx.destination);
 busy={s,i,phase:"count",n:3,t:0};renderODK();
 const wait=ms=>new Promise(r=>setTimeout(r,ms));
 await wait(1000);busy.n=2;renderODK();await wait(1000);busy.n=1;cap=true;renderODK();await wait(1000);
 busy.phase="rec";busy.start=performance.now();renderODK();
 const tick=()=>{if(!busy||busy.phase!=="rec")return;const el=performance.now()-busy.start;const b=document.querySelector(`#slot-${s}-${i} .bar i`);if(b)b.style.width=Math.min(100,el/60)+"%";if(el<6000)requestAnimationFrame(tick)};requestAnimationFrame(tick);
 await wait(6150);cap=false;try{src.disconnect();proc.disconnect();hp.disconnect();lp.disconnect();mute.disconnect()}catch(e){}
 let len=0;chunks.forEach(c=>len+=c.length);const x=new Float32Array(len);let o=0;chunks.forEach(c=>{x.set(c,o);o+=c.length});
 const go=Math.min(len,Math.round(sr*1.0));const end=Math.min(len,go+Math.round(sr*6));const xs=x.slice(0,end);
 AUD[slotKey(s,i)]={x:xs.slice(go),sr};
 const r=detectSyllables(xs,sr,go);
 let rec;
 if(!r.ok)rec={valid:false,count:0,rate:0,t0:null,why:r.why==="quiet"?T.quiet:T.noneFound,onsets:[],env:envPts(r,6)};
 else if(r.t0>1.0)rec={valid:false,count:r.count,rate:r.count/5,t0:r.t0,why:T.late,onsets:r.onsets.map(v=>+v.toFixed(2)),env:envPts(r,6)};
 else rec={valid:true,count:r.count,rate:r.count/5,t0:+r.t0.toFixed(2),onsets:r.onsets.map(v=>+v.toFixed(2)),env:envPts(r,6),adj:0};
 S.odk[s][i]=rec;busy=null;save();renderODK();upd();}
function envPts(r,secs){const pts=[];const n=120,f0=r.goF,span=Math.round(secs*100);const seg=r.db.slice(f0,f0+span);if(!seg.length)return pts;
 const lo=Math.min(...seg),hi=Math.max(...seg);for(let k=0;k<n;k++){const a=Math.floor(k*seg.length/n),b=Math.max(a+1,Math.floor((k+1)*seg.length/n));let m=-Infinity;for(let j=a;j<b;j++)m=Math.max(m,seg[j]);pts.push(+((m-lo)/(hi-lo||1)).toFixed(2))}return pts;}
function play(s,i){const a=AUD[slotKey(s,i)];if(!a||!actx)return;const buf=actx.createBuffer(1,a.x.length,a.sr);buf.copyToChannel(a.x,0);const n=actx.createBufferSource();n.buffer=buf;n.connect(actx.destination);n.start();}
function adjust(s,i,d){const t=S.odk[s][i];if(!t)return;t.count=Math.max(0,t.count+d);t.rate=t.count/5;t.adj=(t.adj||0)+d;if(t.why===T.noneFound||t.why===T.quiet){t.valid=t.count>0;if(t.valid)t.why=""}save();renderODK();upd();}
function manual(s,i,n){S.odk[s][i]={valid:true,manual:true,count:n,rate:n/5,t0:null,onsets:[],env:[]};save();renderODK();upd();}
function clearSlot(s,i){S.odk[s][i]=null;delete AUD[slotKey(s,i)];save();renderODK();upd();}
function slotSvg(t){const W=240,H=40,x=sec=>2+sec/6*(W-4);let s=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">`;
 if(t&&t.t0!==null&&t.t0!==undefined)s+=`<rect x="${x(t.t0)}" y="0" width="${x(Math.min(6,t.t0+5))-x(t.t0)}" height="${H}" fill="var(--accent)" fill-opacity=".12"/>`;
 if(t&&t.env&&t.env.length){const n=t.env.length;s+=`<polyline fill="none" stroke="var(--muted)" stroke-width="1" points="${t.env.map((v,k)=>`${(2+k/(n-1)*(W-4)).toFixed(1)},${(H-3-v*(H-8)).toFixed(1)}`).join(" ")}"/>`}
 if(t&&t.onsets)t.onsets.forEach(o=>{const inn=t.t0!==null&&o>=t.t0&&o<t.t0+5;s+=`<line x1="${x(o)}" x2="${x(o)}" y1="${H-10}" y2="${H}" stroke="${inn?"var(--accent)":"var(--muted)"}" stroke-width="1.4"/>`});
 for(let k=0;k<=6;k++)s+=`<line x1="${x(k)}" x2="${x(k)}" y1="${H-2}" y2="${H}" stroke="var(--line)"/>`;return s+"</svg>";}
function renderODK(){const g=$("#odkgrid");g.innerHTML="";
 g.append(document.createElement("div"));[0,1,2].forEach(i=>{const h=document.createElement("div");h.className="colh";h.textContent=`${T.trial} ${i+1}`;g.append(h)});
 SYL.forEach(s=>{const h=document.createElement("div");h.className="sylh";h.textContent="/"+s+"/";g.append(h);
  [0,1,2].forEach(i=>{const t=S.odk[s][i],live=busy&&busy.s===s&&busy.i===i;const d=document.createElement("div");d.id=`slot-${s}-${i}`;
   d.className="slot"+(live?" live":t?(t.valid?" ok":" bad"):"");
   const hd=document.createElement("div");hd.className="hd";const l1=document.createElement("span");l1.textContent=`/${s}/ · ${T.trial} ${i+1}`;const l2=document.createElement("span");l2.textContent=t&&t.manual?T.manualNote:(t&&t.adj?T.adjusted:"");hd.append(l1,l2);
   const rate=document.createElement("div");rate.className="rate";
   if(live)rate.textContent=busy.phase==="count"?String(busy.n):"●";
   else if(t){rate.textContent=fmt(t.rate,1)+" ";const sm=document.createElement("small");sm.textContent=`/s · ${t.count} ${T.syllables}`;rate.append(sm)}else rate.textContent="–";
   const st=document.createElement("div");st.className="st";
   if(live)st.textContent=busy.phase==="count"?T.ready:T.speak+"/"+s+"/";
   else if(t){if(!t.valid){st.textContent=t.why||T.invalid;st.classList.add("warn")}else st.textContent=t.manual?"":T.firstAt+fmt(t.t0,2)}
   const pic=document.createElement("div");pic.innerHTML=live&&busy.phase==="rec"?'<div class="bar"><i></i></div>':slotSvg(t);
   const acts=document.createElement("div");acts.className="acts";
   const btn=(txt,fn,cls,dis)=>{const b=document.createElement("button");b.type="button";b.textContent=txt;if(cls)b.className=cls;b.disabled=!!dis;b.addEventListener("click",fn);acts.append(b);return b};
   btn(t?T.redo:T.rec,()=>record(s,i),"main",!!busy);
   if(t&&!t.manual){btn(T.play,()=>play(s,i),"",!AUD[slotKey(s,i)]||!!busy);btn("−1",()=>adjust(s,i,-1),"",!!busy);btn("+1",()=>adjust(s,i,1),"",!!busy)}
   if(t)btn(T.del,()=>clearSlot(s,i),"",!!busy);
   const man=document.createElement("div");man.className="man";const inp=document.createElement("input");inp.type="number";inp.min=0;inp.max=60;inp.id=`man-${s}-${i}`;inp.setAttribute("aria-label",T.manualTxt+` /${s}/ ${i+1}`);inp.placeholder="n";
   const ok=document.createElement("button");ok.type="button";ok.className="btn ghost sm";ok.textContent=T.manualBtn;ok.disabled=!!busy;ok.addEventListener("click",()=>{const n=parseInt(inp.value,10);if(!isNaN(n))manual(s,i,n)});
   const ml=document.createElement("span");ml.textContent=T.manualShort;man.append(ml,inp,ok);
   d.append(hd,rate,st,pic,acts,man);g.append(d)})});
 const r=sc();$("#odksum").innerHTML=SYL.map(s=>{const o=r.odk[s];const n=S.odk[s].filter(t=>t&&t.valid).length;return`<div><small>/${s}/ · ${n}/3${T.trialsOf}</small><b class="num">${o?fmt(o.mean,2):"–"}</b>${o?(o.mean<6?`<span class="pill pos">&lt; 6${LANG==="vi"?",":"."}0</span>`:`<span class="pill neg">≥ 6${LANG==="vi"?",":"."}0</span>`):`<span class="pill na">${T.notYet}</span>`}</div>`}).join("");}

/* ---------- results ---------- */
function yn(v){return v===1?T.yesW:v===0?T.noW:"–"}
function renderResults(){const r=sc();const I=S.info;
 $("#r-who").textContent=[I.id||T.noId,I.age?I.age+T.yrs:"",I.sex,I.setting,I.date].filter(Boolean).join(" · ");
 const res={H1:r.tci!==null?fmt(r.tci,1)+" %":"–",H2:r.xi!==null?r.xi+"/25":"–",H3:r.cs!==null?fmt(r.cs,1)+"/100":"–",
  H4:SYL.map(s=>r.odk[s]?`/${s}/ ${fmt(r.odk[s].mean,1)}`:`/${s}/ –`).join(" · "),H5:T.h5Res,
  H6:`${T.b1} ${yn(r.b1)} · ${T.b2s} ${yn(S.b2)} · ${T.b3s} ${yn(S.b3)}`,H7:r.eat!==null?r.eat+"/40":"–"};
 const keys=["H1","H2","H3","H4","H5","H6","H7"];
 const tb=document.createElement("tbody");keys.forEach(k=>{const tr=document.createElement("tr");
  const cells=[[k,"code"],[T.fn[k]],[T.by[k]],[res[k],"num"],[T.cut[k],"num"],[null],[T.acc[k],"note"]];
  cells.forEach(([txt,cls],j)=>{const td=document.createElement("td");if(cls)td.className=cls;if(j===5)td.innerHTML=pill(r[k],k==="H2");else td.textContent=txt;tr.append(td)});tb.append(tr)});
 const tbl=$("#restbl");tbl.innerHTML="";const th=document.createElement("thead");th.innerHTML="<tr><th></th><th></th><th></th><th></th><th></th><th></th><th></th></tr>";[ "",T.thFn,T.thBy,T.thRes,T.thCut,T.thCls,T.thAcc].forEach((t,i)=>th.querySelectorAll("th")[i].textContent=t);tbl.append(th,tb);
 const meas=keys.filter(k=>k!=="H5");const pos=meas.filter(k=>r[k]===true).length,unk=meas.filter(k=>r[k]===null).length;
 let cls,lab,txt;
 if(pos>=3){cls="pos";lab=T.vPos;txt=T.vPosTxt}
 else if(unk>0&&pos+unk>=2){cls="na";lab=T.vNa;txt=T.vNaTxt1+unk+T.vNaTxt2}
 else if(pos===2){cls="tmp";lab=T.vBorder;txt=T.vBorderTxt}
 else{cls="neg";lab=T.vNeg;txt=T.vNegTxt}
 const v=$("#verdict");v.innerHTML=`<div class="count">${pos}<small>/6${T.measured}</small></div><div><span class="pill ${cls}"></span><div style="margin-top:6px" class="vt"></div><div class="note vh"></div></div>`;
 v.querySelector(".pill").textContent=lab;v.querySelector(".vt").textContent=txt;v.querySelector(".vh").textContent=T.hint+yn(S.d1)+T.hint2+yn(S.d2)+".";
 $("#csvout").value=csv(r);}
function csv(r){const h=[],v=[];const add=(k,x)=>{h.push(k);v.push(x===null||x===undefined?"":x)};
 add("lang",LANG);Object.entries(S.info).forEach(([k,x])=>add(k,x));S.eat.forEach((x,i)=>add("eat"+(i+1),x));add("eat_total",r.eat);add("b1_derived",r.b1);add("b2",S.b2);add("b3",S.b3);
 S.food.forEach((x,i)=>add("food"+(i+1),x));add("cs20",r.cs);S.xi.forEach((x,i)=>add("xi"+(i+1),x));add("xi_total",r.xi);add("d1",S.d1);add("d2",S.d2);
 SYL.forEach(s=>{for(let i=0;i<3;i++){const t=S.odk[s][i];add(`odk_${s}_${i+1}`,t&&t.valid?t.rate.toFixed(2):"")}add(`odk_${s}_mean`,r.odk[s]?r.odk[s].mean:"")});
 S.tci.forEach((x,i)=>add("tci"+(i+1),x));add("tci_pct",r.tci);
 ["H1","H2","H3","H4","H6","H7"].forEach(k=>add(k,r[k]===null?"":r[k]?1:0));add("H5","");add("n_positive",["H1","H2","H3","H4","H6","H7"].filter(k=>r[k]===true).length);
 const q=x=>{x=String(x);return/[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x};return h.map(q).join(",")+"\n"+v.map(q).join(",");}
$("#btn-copy").addEventListener("click",()=>{const t=$("#csvout").value;const done=()=>{$("#toast").textContent=T.copied;setTimeout(()=>$("#toast").textContent="",2500)};
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,()=>{$("#csvout").select();$("#toast").textContent=T.selected})}else{$("#csvout").select();$("#toast").textContent=T.selected}});
let dl=null;
(async()=>{try{dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null}catch(e){dl=null}if(!dl){dl={save:async({filename,data})=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"text/csv;charset=utf-8"}));a.download=filename;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}}}$("#btn-dl").hidden=false})();
$("#btn-dl").addEventListener("click",async()=>{if(!dl)return;try{await dl.save({filename:"OHF-SQ_"+(S.info.id||T.file)+".csv",data:"﻿"+$("#csvout").value});$("#toast").textContent=T.saved}catch(e){$("#toast").textContent=e&&e.code==="declined"?T.cancel:T.noSave}});

function bindReset(){const w=$("#reset-wrap");w.innerHTML="";const b=document.createElement("button");b.type="button";b.className="btn ghost";b.textContent=T.reset;w.append(b);
 b.onclick=()=>{w.innerHTML="";const q=document.createElement("span");q.textContent=T.resetQ;const y=document.createElement("button");y.type="button";y.className="btn";y.textContent=T.del;const n=document.createElement("button");n.type="button";n.className="btn ghost";n.textContent=T.keep;w.append(q,y,n);
  y.onclick=()=>{S=blank();save();initAll();bindReset();$("#draft-note").textContent=T.draftNew};n.onclick=bindReset}}
$("#btn-sample").addEventListener("click",()=>{S=blank();S.info={id:"DEMO-001",date:new Date().toISOString().slice(0,10),age:"78",sex:T.sampleSex,setting:T.sampleSetting,exam:T.sampleExam};
 S.eat=[0,1,1,2,1,0,1,1,1,0];S.b2=1;S.b3=0;S.food=[2,2,2,2,2,2,2,2,1,2,2,2,1,1,0,0,0,1,0,"x"];S.xi=[2,3,1,3,2];S.d1=1;S.d2=0;
 const mk=arr=>arr.map(n=>{const on=[];for(let k=0;k<n;k++)on.push(+(0.35+k*5/n).toFixed(2));for(let k=0;k<Math.round(n/5);k++)on.push(+(5.35+k*5/n).toFixed(2));const env=Array.from({length:120},(_,k)=>+(0.55+0.4*Math.abs(Math.sin(k*Math.PI*n/100))).toFixed(2));return{valid:true,count:n,rate:n/5,t0:0.35,onsets:on,env,adj:0}});
 S.odk={pa:mk([31,30,32]),ta:mk([28,27,29]),ka:mk([26,27,25])};S.tci=[2,1,1,1,1,0,0,0,0];save();initAll();$("#draft-note").textContent=T.draftSample;});

function initAll(){fillInfo();buildQ();legend();buildTCI();renderODK();upd()}
bindReset();initAll();go("info");
})();
